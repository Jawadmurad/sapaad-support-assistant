name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          playwright install chromium

      - name: Visit and Wake Streamlit App
        run: |
          python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto('https://sapaad-support-assistant-t5z9n3ubunlvydp3jw4fdy.streamlit.app/', timeout=60000)
              page.wait_for_timeout(5000)
              btn = page.get_by_role('button', name='Yes, get this app back up!')
              if btn.is_visible():
                  print('App was asleep — clicking wake button...')
                  btn.click()
                  page.wait_for_timeout(15000)
              else:
                  print('App is already awake!')
              browser.close()
          "
